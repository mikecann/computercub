name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  native:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build
      - name: Help works without any permissions
        run: .build/debug/computercub help
      - name: Check shell syntax
        run: bash -n scripts/install.sh
